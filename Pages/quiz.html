<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="../Styles/quiz.css">
</head>
<body>
    <div class="header">
        <img src="../Images/Home.png" style="width: 100px; height: 100px;" alt="">
        <a href="./quiz.html">Quiz</a>
        <button id="DarkMode" class="DarkModeButton">Dark Mode</button>
    </div>
    <div class="body">
        <div id="Themes" class="themes">
            <div class="box" style="background-color: red;" onclick="StartQuiz('Flag')">
                <h1>Flag</h1>
            </div>
        </div>
        <div id="Quiz" class="hide">
            <div class="question">
                <div style="width: 250px; height: 250px;">
                    <img id="QuestionImage" src="../Images/flags/ad.png" alt="" style="max-width: 250px; max-height: 250px;display:flex; justify-content: center; align-items: center;">
                </div>
                <h1 id="QuestionText" style="max-width: 400;">Hello</h1>
            </div>
            <div class="answers">
                <div class="answer" onclick="ChooseAnswer(1)">
                    <p>A) <p id="Answer1">Andorra</p></p>
                </div>
                <div class="answer" onclick="ChooseAnswer(2)">
                    <p>B) <p id="Answer2">Morroco</p></p>
                </div>
                <div class="answer" onclick="ChooseAnswer(3)">
                    <p>C) <p id="Answer3">Italy</p></p>
                </div>
                <div class="answer" onclick="ChooseAnswer(4)">
                    <p>D) <p id="Answer4">Equador</p></p>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    const themes = document.getElementById("Themes")
    const quiz = document.getElementById("Quiz")

    function StartQuiz(quizType){
        themes.classList.toggle("hide")
        if (quizType == "Flag"){
            FlagQuiz()
        }
    }

    function FlagQuiz(){
        if (quiz.classList.contains("hide"))
        {
            console.log("Has hide")
            quiz.classList.replace("hide", "quiz")
        }
        else
        {
            console.log("Doesnt have hide")
            quiz.classList.replace("quiz", "hide")
        }
    }
</script>
</html>
