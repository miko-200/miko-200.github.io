<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="../Styles/quiz.css">
</head>
<body>
    <div class="header">
        <img src="../Images/Home.png" style="width: 100px; height: 100px;" alt="">
        <a href="./quiz.html">Quiz</a>
        <button id="DarkMode" class="DarkModeButton">Dark Mode</button>
    </div>
    <div class="body">
        <div id="Themes" class="themes">
            <div class="box" style="background-color: red;" onclick="StartQuiz('Flag')">
                <h1>Flag</h1>
            </div>
        </div>
        <div id="Quiz" class="hide">
            <div class="question">
                <div style="width: 350px; height: 350px; display:contents; justify-content: center;">
                    <img id="QuestionImage" src="../Images/flags/ad.png" alt="" style="max-width: 350px; max-height: 350px;">
                </div>
                <h1 id="QuestionText" style="max-width: 400;">Hello</h1>
            </div>
            <div class="answers">
                <div class="answer-box answer-box-color-normal" onclick="ChooseAnswer(1)">
                    <p id="Answer1">Andorra</p>
                </div>
                <div class="answer-box answer-box-color-normal" onclick="ChooseAnswer(2)">
                    <p id="Answer2">Morroco</p>
                </div>
                <div class="answer-box answer-box-color-normal" onclick="ChooseAnswer(3)">
                    <p id="Answer3">Italy</p>
                </div>
                <div class="answer-box answer-box-color-normal" onclick="ChooseAnswer(4)">
                    <p id="Answer4">Equador</p>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    const themes = document.getElementById("Themes")
    const quiz = document.getElementById("Quiz")

    function StartQuiz(quizType){
        themes.classList.toggle("hide")
        if (quizType == "Flag"){
            FlagQuiz()
        }

        if (quiz.classList.contains("hide"))
        {
            console.log("Has hide")
            quiz.classList.replace("hide", "quiz")
        }
        else
        {
            console.log("Doesnt have hide")
            quiz.classList.replace("quiz", "hide")
        }
    }


    const QuestionText = document.getElementById("QuestionText")
    const QuestionImage = document.getElementById("QuestionImage")

    const Answer1Text = document.getElementById("Answer1")
    const Answer2Text = document.getElementById("Answer2")
    const Answer3Text = document.getElementById("Answer3")
    const Answer4Text = document.getElementById("Answer4")


    let flagsLength = 0;

    async function loadFlagsLength() {
        const response = await fetch("../Jsons/flags.json");
        const flags = await response.json();
        flagsLength = flags.length;
        console.log(flagsLength)
    }

    document.addEventListener("DOMContentLoaded", async () => {
        await loadFlagsLength();
        console.log(flagsLength)
    });

    function FlagQuiz(){

        const flagQuizQuestions = ["What is this flag?"]
        QuestionText.textContent = flagQuizQuestions;
        
        const alreadyUsedFlags = []; 
        console.log(alreadyUsedFlags)

        for (let i = 0; i < 1; i++){
            console.log("in the main for loop")
            let correctFlagNum = 0;
            while (true){
                correctFlagNum = Math.floor(Math.random() * flagsLength)+1
                if (alreadyUsedFlags != undefined || alreadyUsedFlags != null){
                    let isInArray = false;
                    for (let j = 0; j < alreadyUsedFlags;j++){
                        if (correctFlagNum == alreadyUsedFlags[j]){
                            isInArray = true;
                            break;
                        }
                    }

                    if (!isInArray){
                        console.log("Correct flag num: " + correctFlagNum);
                        alreadyUsedFlags[alreadyUsedFlags.length] = correctFlagNum;
                        break;
                    }

                }
                else{
                    console.log("Correct flag num: " + correctFlagNum);
                    alreadyUsedFlags[alreadyUsedFlags.length] = correctFlagNum;
                    break;
                }
            }

            const incorrectFlagNums = [];

            for (let j = 0; j < 3; j++){
                while (true){
                    let incFlagNum = Math.floor(Math.random() * flagsLength)+1;
                    if (incFlagNum != correctFlagNum){
                        if (incorrectFlagNums != undefined || incorrectFlagNums != null){
                            let isInArray = false;
                            for (let k = 0; j < incorrectFlagNums.length;k++){
                                if (incFlagNum == incorrectFlagNums[j]){
                                    isInArray = true;
                                    break;
                                }
                            }

                            if (isInArray){
                                continue;
                            }
                        }
                        incorrectFlagNums[incorrectFlagNums.length] = incFlagNum;
                        console.log("Incorrect flag num: " + incFlagNum);
                        console.log("Incorrect flags: " + incorrectFlagNums)
                        break;
                    }
                    

                }
            }

            console.log("Already used flags: " + alreadyUsedFlags)
            console.log("Incorrect flags: " + incorrectFlagNums)

            const answers = [];

            answers[0] = correctFlagNum;
            answers[1] = incorrectFlagNums[0];
            answers[2] = incorrectFlagNums[1];
            answers[3] = incorrectFlagNums[2];

            console.log("Answers before shuffle: " + answers);
            ShuffleArray(answers)
            console.log("Answers after shuffle: " + answers);

        }


    }

    function ShuffleArray(array){
        const arrayCopy = []
        for (let i = 0; i < array.length; i++){
            arrayCopy[i] = array[i]
        }

        for (let i = 0; i < 5; i++){
            const usedIndex = []
            for (let j = 0; j < array.length; j++){
                const rnum = Math.floor(Math.random() * array.length);

                let isInArray = false;
                for (let k = 0; k < usedIndex.length;k++){
                    if (rnum = usedIndex[k]){
                        isInArray = true;
                        break;
                    }
                }

                if (isInArray){
                    j--;
                    continue;
                }

                array[j] = arrayCopy[rnum];
                usedIndex[j] = rnum;
            }
            console.log("Shuffle " + i + ":" + array)
            console.log(usedIndex)
        }
    }

    function ChooseAnswer(answer){
        console.log("Chosen answer: " + answer)
    }
</script>
</html>
